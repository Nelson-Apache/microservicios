server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Promtail recuerda hasta dónde leyó cada archivo para no reenviar logs.
positions:
  filename: /tmp/positions.yaml

# Loki recibe los logs por push desde este cliente.
clients:
  - url: http://loki:3100/loki/api/v1/push

# Descubre contenedores Docker, añade etiquetas útiles y extrae campos JSON
# para que luego puedan filtrarse en Grafana Explore.
scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            traceId: traceId
      - labels:
          level:
          service:
