apiVersion: 1

# Esta política enruta todas las alertas al contact point Discord y controla
# el agrupamiento y la frecuencia de repetición de notificaciones.
policies:
  - orgId: 1
    receiver: Discord
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
