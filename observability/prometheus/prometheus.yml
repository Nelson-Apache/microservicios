global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus consulta cada microservicio por HTTP y recolecta métricas en Pull.
# Los jobs de abajo deben coincidir con los nombres de servicio usados en Grafana.
scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8085']

  - job_name: 'empleados-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['empleados-service:8080']

  - job_name: 'departamentos-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['departamentos-service:8080']

  - job_name: 'notificaciones-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notificaciones-service:3000']

  - job_name: 'perfiles-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['perfiles-service:3000']

  - job_name: 'reportes-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['reportes-service:3000']
