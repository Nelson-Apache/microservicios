spring.application.name=departamentos-service

# ──────────────────────────────────────────
# Base de datos PostgreSQL
# ──────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/departamentosdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ──────────────────────────────────────────
# Puerto del servidor
# ──────────────────────────────────────────
server.port=${PORT:8080}

# ──────────────────────────────────────────
# OpenAPI / Swagger
# ──────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItOutEnabled=true

# ──────────────────────────────────────────
# Spring Boot Actuator — Reto 7
# ──────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.defaults.enabled=true
management.prometheus.metrics.export.enabled=true

# ──────────────────────────────────────────
# Trazabilidad distribuida (Micrometer → OpenTelemetry → Zipkin)
# ──────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
spring.application.name=departamentos-service
